name: $(Year:yy)$(DayOfYear).$(Rev:r)
trigger:
  - master
pr:
  branches:
    include:
      - master
resources:
  repositories:
    - repository: templates
      type: github
      endpoint: shared-github
      name: audaciaconsulting/Audacia.Build

pool:
  vmImage: windows-latest

variables:
  - group: Audacia.Libraries.Dependency-Track

  # Secrets / env
  - name: DT_API_KEY
    value: $(DT-API-KEY)
  - name: DT_API_URL
    value: $(DT-API-URL)

  # Template-parameter variables
  - name: systemName
    value: Audacia.Libraries - Audacia.Angular
  - name: deactivateOld
    value: true

  # Optional parent project
  - name: parentProjectName
    value: 'Audacia.Angular Libraries'
  - name: parentProjectVersion
    value: ''

  # Project paths and settings
  - name: rootPackageJson
    value: $(System.DefaultWorkingDirectory)
  - name: baseUrlInterceptorPackageJson
    value: $(System.DefaultWorkingDirectory)/projects/audacia/base-url-interceptor
  - name: dateParseInterceptorPackageJson
    value: $(System.DefaultWorkingDirectory)/projects/audacia/date-parse-interceptor
  - name: jwtInterceptorPackageJson
    value: $(System.DefaultWorkingDirectory)/projects/audacia/jwt-interceptor
  - name: requestDisableInterceptorPackageJson
    value: $(System.DefaultWorkingDirectory)/projects/audacia/request-disable-interceptor
  - name: responseInterceptorPackageJson
    value: $(System.DefaultWorkingDirectory)/projects/audacia/response-interceptor
  - name: artifactName
    value: 'sbom-files'
  - name: publishArtifact
    value: true
  - name: failOnUploadError
    value: true
  - name: tryDownloadArtifact
    value: true

stages:
  # =========================
  # 1) GENERATE STAGE
  # =========================
  - stage: generate
    displayName: "Generate SBOMs (npm + .NET via CycloneDX)"
    jobs:
      - job: generate_sbom
        displayName: "Generate SBOMs & publish artifact"
        steps:
          # Generate npm SBOMs
          - template: /src/security/dependency-track/steps/generate-npm-sbom.steps.yaml@templates
            parameters:
              npmRoots: |
                $(rootPackageJson)
                $(baseUrlInterceptorPackageJson)
                $(dateParseInterceptorPackageJson)
                $(jwtInterceptorPackageJson)
                $(requestDisableInterceptorPackageJson)
                $(responseInterceptorPackageJson)
              includeLicenseTexts: true
              publishArtifact: ${{ variables.publishArtifact }}
              artifactName: $(artifactName)

  # =========================
  # 2) UPLOAD STAGE
  # =========================
  - stage: upload
    displayName: "Upload SBOMs to Dependency-Track"
    dependsOn: generate
    jobs:
      - job: upload_sbom
        displayName: "Upload SBOM & Log Summary"
        steps:
          - checkout: none
          - template: /src/security/dependency-track/steps/upload-sbom.steps.yaml@templates
            parameters:
              systemName: $(systemName)
              failOnUploadError: ${{ variables.failOnUploadError }}
              parentProjectName: ${{ variables.parentProjectName }}
              parentProjectVersion: ${{ variables.parentProjectVersion }}

  # =========================
  # 3) DEACTIVATE STAGE (run standalone or after upload)
  # =========================
  - stage: deactivate
    displayName: "Deactivate old Dependency-Track project versions"
    dependsOn: upload
    condition: and(succeeded('upload'), eq(variables['deactivateOld'], true))
    jobs:
      - job: deactivate_old_versions
        displayName: "Set non-latest versions to inactive"
        steps:
          - checkout: none
          - template: /src/security/dependency-track/steps/deactivate-nonlatest.steps.yaml@templates
            parameters:
              artifactName: $(artifactName)
              tryDownloadArtifact: ${{ variables.tryDownloadArtifact }}
              parentProjectName: ${{ variables.parentProjectName }}
